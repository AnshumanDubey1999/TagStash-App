name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build & Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Run File Length Check (checkFileLength)
        run: ./gradlew checkFileLength

      - name: Run Detekt Static Analysis (detekt)
        run: ./gradlew detekt

      - name: Run Build (assembleDebug)
        run: ./gradlew assembleDebug

      - name: Run Tests (test)
        run: ./gradlew test

      - name: Upload Detekt Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: detekt-reports
          path: app/build/reports/detekt/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Unit Test HTML Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Unit Test XML Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-results
          path: app/build/test-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Roborazzi Screenshots & Outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: roborazzi-screenshots
          path: |
            app/screenshots/
            app/build/outputs/roborazzi/
            app/build/reports/roborazzi/
            if-no-files-found: warn
          retention-days: 14
